
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101810">
  <title>PotroPlay | Downloads oficiais</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #101810;
      color: white;
      font-family: Arial, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 430px;
      padding: 36px 24px;
      text-align: center;
      background: #1b251c;
      border: 1px solid #344536;
      border-radius: 22px;
    }
    .logo {
      font-size: 36px;
      font-weight: 900;
      letter-spacing: 1px;
    }
    .logo span { color: #52dc7b; }
    .slogan {
      margin: 12px 0 30px;
      color: #c0d0c1;
      letter-spacing: 2px;
      font-size: 12px;
    }
    .button {
      display: block;
      margin-top: 15px;
      padding: 17px;
      border-radius: 12px;
      background: #32bd60;
      color: #07140a;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
    }
    .button:hover { background: #52dc7b; }
    .note {
      margin-top: 25px;
      color: #a9b9aa;
      font-size: 12px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">POTRO<span>PLAY</span></div>
    <div class="slogan">SUA TV DO SEU JEITO</div>

    <h2>Baixe seu aplicativo</h2>
    <p>Escolha a versão para o seu dispositivo.</p>

    <a class="button"
       href="https://drive.google.com/uc?export=download&id=1wbpLQGK3LsDBj3QmkZtOL9z5lIsRsgrQ">
      📱 BAIXAR PARA CELULAR
    </a>

    <a class="button"
       href="https://drive.google.com/uc?export=download&id=1Xu5hFKSxpk8YOJkvkVdXBPbTlNY8nUPV">
      📺 BAIXAR PARA TV
    </a>

    <div class="note">
      PotroPlay — SUA TV DO SEU JEITO<br>
      Baixe a versão compatível com seu dispositivo.
    </div>
  </main>
</body>
</html>
